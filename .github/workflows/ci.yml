
name: DataPulse CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest "dbt-postgres"

      - name: Run Python tests
        run: |
          python -m pytest -v

  dbt-validation:
    name: dbt project validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install "dbt-postgres"

      - name: Configure temporary dbt profile
        env:
          DBT_PASSWORD: ci_dummy_password
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<'EOF'
          datapulse_dbt:
            target: dev
            outputs:
              dev:
                type: postgres
                host: localhost
                port: 5433
                user: olist_user
                password: "{{ env_var('DBT_PASSWORD') }}"
                dbname: olist
                schema: analytics
                threads: 2
          EOF

      - name: Parse dbt project
        env:
          DBT_PASSWORD: ci_dummy_password
        working-directory: datapulse_dbt
        run: dbt parse
