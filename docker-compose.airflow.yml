
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  environment:
    AIRFLOW__CORE__EXECUTOR: SequentialExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/metadata/airflow.db
    DB_HOST: host.docker.internal
    DB_PORT: "5433"
    DB_NAME: olist
    DB_USER: olist_user
    DB_PASSWORD: ${DB_PASSWORD}
    DBT_PROFILES_DIR: /opt/airflow/project/.dbt
    DBT_PASSWORD: ${DB_PASSWORD}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./:/opt/airflow/project
    - ./airflow/metadata:/opt/airflow/metadata
  working_dir: /opt/airflow/project

services:
  airflow-init:
    <<: *airflow-common
    command:
      - bash
      - -c
      - airflow db migrate && airflow users create --username admin --password admin --firstname Data --lastname Engineer --role Admin --email admin@example.com || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped
